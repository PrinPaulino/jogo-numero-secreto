<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Jogo do Número Secreto</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#0f172a,#1e3a8a);font-family:Arial,sans-serif;color:white;padding:20px}.jogo{width:min(100%,430px);background:#172554;padding:32px;border-radius:22px;text-align:center;box-shadow:0 18px 40px #0006}h1{font-size:1.8rem;margin:0 0 12px}.sub{color:#cbd5e1;line-height:1.5}.tentativas{font-weight:bold;color:#7dd3fc;margin:24px 0 14px}input{width:100%;padding:16px;border:2px solid #93c5fd;border-radius:12px;font-size:1.1rem;text-align:center;outline:none}button{width:100%;margin-top:13px;padding:15px;border:0;border-radius:12px;background:#38bdf8;color:#082f49;font-weight:bold;font-size:1rem;cursor:pointer}button:hover{background:#7dd3fc}button:disabled{opacity:.5;cursor:not-allowed}.mensagem{min-height:60px;margin-top:20px;padding:15px;border-radius:12px;background:#1e3a8a;line-height:1.5}.reiniciar{background:#facc15;color:#422006}.reiniciar:hover{background:#fde047}
</style>
</head>
<body>
<main class="jogo"><h1> Jogo do Número Secreto</h1><p class="sub">Adivinhe o número de 
  <strong>1 a 100</strong>!<br>Você tem apenas <strong>3 tentativas</strong>.<br> Turma: Técnico em Informática - Senac Contagem</p>
  <p class="tentativas" id="tentativas">Tentativas restantes: 3</p><form id="form">
    <label for="palpite">Digite seu palpite:</label><input id="palpite" type="number" min="1" max="100" step="1" required placeholder="Ex.: 42" autocomplete="off"><button id="tentar" type="submit">Tentar acertar</button></form><p class="mensagem" id="mensagem" role="status" aria-live="polite">Boa sorte! Faça seu primeiro palpite.</p><button class="reiniciar" id="reiniciar" type="button">🔄 Reiniciar jogo</button></main>
<script>
let numeroSecreto;
let tentativas;
let numeroAnterior = null;
const form = document.getElementById('form');
const palpite = document.getElementById('palpite');
const mensagem = document.getElementById('mensagem');
const textoTentativas = document.getElementById('tentativas');
const tentar = document.getElementById('tentar');
function novoNumero(){
  let sorteado;
  do { sorteado = Math.floor(Math.random()*100)+1; } while (sorteado === numeroAnterior);
  numeroAnterior = sorteado;
  return sorteado;
}
function reiniciar(){
  numeroSecreto = novoNumero();
  tentativas = 3;
  textoTentativas.textContent = 'Tentativas restantes: 3';
  mensagem.textContent = 'Boa sorte! Faça seu primeiro palpite.';
  palpite.value = '';
  palpite.disabled = false;
  tentar.disabled = false;
  palpite.focus();
}
form.addEventListener('submit', function(evento){
  evento.preventDefault();
  const valor = Number(palpite.value);
  if (!Number.isInteger(valor) || valor < 1 || valor > 100 || palpite.value.trim() === '') {
    mensagem.textContent = 'Digite um número inteiro entre 1 e 100.';
    return;
  }
  tentativas--;
  textoTentativas.textContent = `Tentativas restantes: ${tentativas}`;
  if (valor === numeroSecreto) {
    mensagem.textContent = `🎉 Parabéns! Você acertou o número ${numeroSecreto}!`;
    encerrar();
  } else if (tentativas === 0) {
    mensagem.textContent = `😢 Fim de jogo! O número secreto era ${numeroSecreto}.`;
    encerrar();
  } else {
    mensagem.textContent = valor < numeroSecreto ? '⬆️ O número secreto é MAIOR!' : '⬇️ O número secreto é MENOR!';
    palpite.value = '';
    palpite.focus();
  }
});
function encerrar(){palpite.disabled=true;tentar.disabled=true;}
document.getElementById('reiniciar').addEventListener('click', reiniciar);
reiniciar();
</script>
</body>
</html>
